<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红色的球鞋 · 付与涵的房间</title><link rel="stylesheet" href="styles.css"><script src="explore.js" defer></script></head><body><header class="topbar"><a class="brand" href="index.html">付与涵 BILL</a><a class="back" href="index.html">← 返回房间</a></header><main><div class="scene-shell"><div class="scene"><img class="room" src="assets/room.png" alt="灰色线稿房间"><div class="shade"></div><img class="layer story-object boots-story" src="assets/boots.png" alt="红色足球鞋"></div><div class="story-window"><article class="story story--boots"><h1>红色的球鞋</h1><p>这是我自己买的第一双真心觉得好看的足球鞋。当时没有想太多，只觉得它很帅。</p><p>它陪我度过了很难踢上球的那两年。在学校，我很难和身边的人合得来，也遭遇了队友的排斥。我没有参加过任何一场校队比赛，连娱乐比赛也很少有机会加入。</p><p>穿了一年多后，鞋底坏了。我专门找了一个能发光的鞋柜，把它收藏起来。</p><p>鞋底坏了，这双鞋却被我留了下来。</p></article></div></div><div class="bottom-bar"><p class="intro">一双被收藏起来的球鞋</p><nav class="links"><a href="index.html">回到球鞋所在的地方 →</a></nav></div></main></body></html>
