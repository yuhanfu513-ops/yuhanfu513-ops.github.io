<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一次创造 · 付与涵的房间</title><link rel="stylesheet" href="styles.css"><script src="explore.js" defer></script></head><body><header class="topbar"><a class="brand" href="index.html">付与涵 BILL</a><a class="back" href="index.html">← 返回房间</a></header><main><div class="scene-shell"><div class="scene"><img class="room" src="assets/room.png" alt="灰色线稿房间"><div class="shade"></div><img class="layer story-object laptop-story" src="assets/laptop.png" alt="苹果电脑"></div><div class="story-window"><article class="story story--laptop"><h1>第一次创造</h1><p>去探月之前，原来的电脑已经不够用，难以完成学校里的各项事务。我向父亲要了这台苹果电脑。</p><p>一位很擅长这方面的学长，教我购买 API、订阅 AI 工具，也带我学会用 AI 做网页。</p><p>第一次尝试 vibe coding，我用 DeepSeek 的 API 做了一个小游戏。这件事颠覆了我当时的认知，也让我开始了解互联网和 AI。</p><p>从使用电脑，到尝试创造自己的东西。</p></article></div></div><div class="bottom-bar"><p class="intro">从使用电脑，到创造自己的东西</p><nav class="links"><a href="index.html">回到电脑所在的地方 →</a></nav></div></main></body></html>
