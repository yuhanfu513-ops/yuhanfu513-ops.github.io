<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曾经的理想 · 付与涵的房间</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html">付与涵 BILL</a><a class="back" href="index.html">← 返回房间</a></header><main><div class="scene-shell"><div class="scene"><img class="room" src="assets/room.png" alt="灰色线稿房间"><div class="shade"></div><img class="layer cello-story" src="assets/cello.png" alt="大提琴"></div><article class="story story--cello"><h1>曾经的理想</h1><p>12岁之前，大提琴几乎占满了我的时间。我曾经想成为一名职业大提琴演奏家，也想考进音乐附中。</p><p>后来，我发现自己的能力和当时的条件还不足以支撑这条路。同时，我也找到了更想做的事，于是放下了这个目标。</p><p>我发现，自己更喜欢创造一些东西，让别人感到幸福。现在，我想走向工业设计和产品设计。</p></article></div><div class="bottom-bar"><p class="intro">一段关于改变方向的故事</p><nav class="links"><a href="cello-reveal.html">回到大提琴所在的地方 →</a></nav></div></main></body></html>
